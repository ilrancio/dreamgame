<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreamgame</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hidden">
      <div id="objective"></div>
      <div id="compass"><div class="arrow">▲</div></div>
      <div id="stats-top">
        <span id="hud-time">0:00</span>
        <span id="hud-dodges">Schivate 0</span>
      </div>
      <div id="dash">
        <div id="speed"><span id="speed-value">0</span><small id="speed-unit">km/h</small></div>
        <div class="bar-label" id="turbo-label">Turbo <kbd>Shift</kbd></div>
        <div class="bar"><div id="turbo-fill"></div></div>
        <div class="bar-label" id="health-label">Macchina</div>
        <div class="bar"><div id="health-fill"></div></div>
      </div>
      <div id="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> guida · <kbd>Spazio</kbd> freno a mano ·
        <kbd>R</kbd> rimetti in strada · <kbd>P</kbd> pausa
      </div>
    </div>

    <div id="elevator"></div>
    <div id="prizes"></div>
    <div id="bestiary"></div>
    <div id="choice"></div>
    <div id="terminal">
      <div class="term-frame"><canvas id="terminal-canvas"></canvas></div>
      <div id="terminal-footer"></div>
    </div>
    <div id="gesture">
      <canvas id="gesture-canvas"></canvas>
      <div id="gesture-footer"></div>
    </div>
    <div id="arcade">
      <div class="crt"><canvas id="arcade-canvas"></canvas></div>
      <div id="arcade-footer"></div>
    </div>
    <div id="steam"></div>
    <div id="glitch"></div>
    <div id="crosshair"></div>
    <div id="subtitle"></div>
    <div id="popups"></div>
    <div id="center"></div>
    <div id="hint"></div>
    <div id="fade"></div>

    <div id="title">
      <div class="title-inner">
        <h1>DREAMGAME</h1>
        <p class="tagline">un sogno che non finisce</p>
        <p class="enter" id="title-enter">clicca per entrare</p>
        <div id="title-actions" class="hidden">
          <button id="btn-continue">Continua il sogno</button>
          <button id="btn-restart" class="ghost">Ricomincia dal campo</button>
        </div>
        <p class="small">cuffie consigliate</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
